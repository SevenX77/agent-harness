# SonarCloud Automatic Analysis configuration.
# Automatic Analysis does NOT read sonar-project.properties; only this file
# (on the default branch) is honored. See round-30 (PR #102) for the switch
# from CI-based scanning to Automatic Analysis.

# Classify test code as test scope so test conventions (tmp dirs, mock
# credentials, float equality asserts, fixture-injected args) do not count
# against production reliability/security ratings.
sonar.test.inclusions=**/tests/**,**/conftest.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Not product code: one-off diagnostic scripts and generated/system dirs.
#
# There is deliberately no `docs/**/*.html` entry here. Those pages (the N6
# handbook, the 12D repair framework, the mvp0 mockup) were briefly excluded as
# generated artifacts and were then deleted outright on 2026-08-12 — see
# AGENTS.md "Standard Documents → 退役". An exclusion for files that no longer
# exist is exactly the dead config that decision was made to avoid: if HTML ever
# returns under docs/, decide then whether it is product code.
sonar.exclusions=code-diagnostics/**,**/migrations/**,**/__pycache__/**,**/node_modules/**

# Duplication scope: skill packages under skills/ are test-fixture sample
# packages whose phase validators are intentionally similar; tests and mock
# data repeat setup by design. They stay in issue analysis but not CPD.
sonar.cpd.exclusions=skills/**,**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
