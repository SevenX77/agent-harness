# SonarCloud Automatic Analysis configuration.
# Automatic Analysis does NOT read sonar-project.properties; only this file
# (on the default branch) is honored. See round-30 (PR #102) for the switch
# from CI-based scanning to Automatic Analysis.

# Classify test code as test scope so test conventions (tmp dirs, mock
# credentials, float equality asserts, fixture-injected args) do not count
# against production reliability/security ratings.
sonar.test.inclusions=**/tests/**,**/conftest.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Not product code: one-off diagnostic scripts and generated/system dirs.
#
# docs/**/*.html is every HTML page under docs/, and all four are generated or
# reference artifacts — the N6 handbook is built from tpl-*.json slices by
# build_template_slice.py, the 12D repair framework has its own generator and
# validator, and the mvp0 mockup is a picture of a UI. None of them ships or
# runs. They were the project's single largest source of "bugs": 32 findings in
# the handbook and 26 in the repair framework, and **16 of the 31 BUGs in the
# whole project were in generated documentation** — mostly duplicate element
# ids, which say something about the generator and nothing about the product.
# Fixing them by hand would be fixing the output instead of the program, and
# leaving them counted means the 15 real bugs sit behind noise. The generators'
# own sources (build_template_slice.py and friends, also under docs/) stay in
# analysis; only their output leaves.
sonar.exclusions=code-diagnostics/**,**/migrations/**,**/__pycache__/**,**/node_modules/**,docs/**/*.html

# Duplication scope: skill packages under skills/ are test-fixture sample
# packages whose phase validators are intentionally similar; tests and mock
# data repeat setup by design. They stay in issue analysis but not CPD.
sonar.cpd.exclusions=skills/**,**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
