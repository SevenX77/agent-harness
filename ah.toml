# ah 编程 SOP · agent-harness 实例(经典版拓扑)
# 源自 SevenX77/ah-scenario-pack v0.6.0 classic 模板:
#   master(项目经理)+ 实施线 c1/c2(dual codex,全链路自写自测 TDD)
#   + 设计线(o1 辩论席 + d1 主笔/r2 后备审核)+ r1 统一审核席 + test 测试席。
# 与模板的有意差异(模板 ah.toml.example 有三处会翻车的配置错,按 ah 官方 schema 修正):
#   ① 补 version="1"(缺失则 validate 直接失败);
#   ② master 用顶层 [master] 表(写 [agents.master] 会孵化假 master worker,v0.2.0 教训);
#   ③ hook 推送放 [completion] 表(裸键被静默忽略,完成信号根本不开)。
# 启动方式与本机(Windows/WSL)注意事项:.ah/README.md;验证命令档案:.ah/VERIFY.md。
version = "1"

# 项目经理:派单/排期/辩论主持/哨兵;其上是 operator(用户代理 CEO)。
[master]
cmd = "claude"
enabled = true
# WSL 以 root 运行且需要 bypass 权限时改用(claude 对 root 强制 IS_SANDBOX=1;
# 必须 env 形式承载,systemd-run 直连路径不展开裸 VAR=1 前缀):
# cmd = "env IS_SANDBOX=1 claude --dangerously-skip-permissions"

# 完成信号:provider Stop hook 直推 ahd(「内部后台任务型假完成」的编排器侧根治)
[completion]
hook_push_enabled = true
hook_push_events = ["stop"]
hook_push_providers = ["claude", "codex", "antigravity"]

# 实施线(dual codex,同角色两实例纯为并发;全链路自写自测 TDD,真实性由 r1 回滚自检把关)
[agents.c1]
provider = "codex"

[agents.c2]
provider = "codex"

# 设计辩论席(oracle):第一性质疑/替代方案/推翻问法 + 对质回合 + spec 忠实度对抗审;
# markdown-only 且产物必须落盘;必须与 master/d1 异族(同族发散=回音壁)。
[agents.o1]
provider = "antigravity"

# 设计主笔 + r2 后备审核(双角色,帽子由 master 派单类型决定;自证闭环回避见 rules)
[agents.d1]
provider = "claude"

# 统一审核席:只审不写,统一审 c1/c2;回滚自检必跑
[agents.r1]
provider = "claude"

# 测试席:e2e + 验收测试执笔(安全关键时先写 RED);要真 e2e/深度语义验证选 claude 类
[agents.test]
provider = "claude"

# ── CLI 层配置(模型 / effort / statusline)──────────────────────────────
# 仅 claude provider 支持 settings;codex(c1/c2)与 antigravity(o1)的模型档在各自宿主全局配置。
# 分档:质量门(r1 审核 + d1 执笔)= Opus 4.8 + xhigh 顶配;master = Sonnet 5 + medium(编排是
# 短视野决策、又是最烧 token 的常驻位);test = Sonnet 5 + high(e2e 判断要强,执笔量中等)。
# 生效时机=沙箱物化(spawn)时;在跑的 agent 需 kill+up / 重启栈才带新配置。

[master.settings]
model = "claude-sonnet-5"
effortLevel = "medium"
autoCompactEnabled = true

[master.settings.statusLine]
type = "command"
command = "jq -r '\"master · \\(.model.display_name) \\(.effort.level // \"?\") · ctx \\(.context_window.used_percentage // 0)%\"'"

[agents.d1.settings]
model = "claude-opus-4-8"
effortLevel = "xhigh"
autoCompactEnabled = true

[agents.d1.settings.statusLine]
type = "command"
command = "jq -r '\"d1-design · \\(.model.display_name) \\(.effort.level // \"?\") · ctx \\(.context_window.used_percentage // 0)%\"'"

[agents.r1.settings]
model = "claude-opus-4-8"
effortLevel = "xhigh"
autoCompactEnabled = true

[agents.r1.settings.statusLine]
type = "command"
command = "jq -r '\"r1-review · \\(.model.display_name) \\(.effort.level // \"?\") · ctx \\(.context_window.used_percentage // 0)%\"'"

[agents.test.settings]
model = "claude-sonnet-5"
effortLevel = "high"
autoCompactEnabled = true

[agents.test.settings.statusLine]
type = "command"
command = "jq -r '\"test-seat · \\(.model.display_name) \\(.effort.level // \"?\") · ctx \\(.context_window.used_percentage // 0)%\"'"

# 注意:worker 代理 env([agents.<id>.env] HTTP(S)_PROXY 三行 ×6)与 master 的 env 变体
# 属本机运行时注入,不入库——拉栈前跑 .ah/README.md 的注入自检(grep -c HTTP_PROXY 应=6)。
