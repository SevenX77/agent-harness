name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,studio]
      - name: ruff check
        run: ruff check src/ tests/
      - name: mypy strict
        run: mypy src/
      - name: pytest with coverage
        run: pytest tests/ -x --tb=short --cov=src/core/graph_agent --cov-report=xml --cov-report=term
      - name: coverage gate
        run: coverage report --fail-under=73
      - name: dependency audit
        run: pip-audit --skip-editable
