# ═══════════════════════════════════════════════════════════════════════════════
# LLM Role → Model → Provider 配置
# ═══════════════════════════════════════════════════════════════════════════════
#
# 三段式结构：
#   1. models    — 模型注册表（代号 → 模型详情）
#   2. providers — Provider 注册表（代号 → 连接详情）
#   3. roles     — 角色注册表（调用方唯一入口）
#
# 代号规则：
#   模型代号    — 大写缩写，如 CL46T = Claude 4.6 Thinking
#   Provider 代号 — 大写缩写，如 OC_CL = OneChats Claude
#
# 热加载：修改此文件后无需重启，下次 LLM 调用自动生效。
# ═══════════════════════════════════════════════════════════════════════════════


# ── 模型注册表 ────────────────────────────────────────────────────────────────

models:
  CL46T:
    name: "Claude Sonnet 4.6 Thinking"
    reasoning: true
    min_max_tokens: 8192
    fc_supported: true
    providers:
      OC_CL_ANT: "claude-sonnet-4-6-thinking"
      OC_CL: "claude-sonnet-4-6-thinking"
      WS_LLM: "anthropic/claude-sonnet-4.6"
    provider_options:
      OC_CL:
        max_max_tokens: 8192

  CLO46T:
    name: "Claude Opus 4.6 Thinking"
    reasoning: true
    min_max_tokens: 8192
    fc_supported: true
    providers:
      OC_CL_ANT: "claude-opus-4-6-thinking"
      OC_CL: "claude-opus-4-6-thinking"
      WS_LLM: "anthropic/claude-opus-4.6"
    provider_options:
      OC_CL:
        max_max_tokens: 8192

  GM31P:
    name: "Gemini 3.1 Pro Preview"
    reasoning: false
    min_max_tokens: 8192
    fc_supported: false
    providers:
      OC_GM: "gemini-3.1-pro-preview"
      GM_OFF: "gemini-3.1-pro-preview"
      WS_LLM: "google/gemini-3.1-pro-preview"

  DS32C:
    name: "DeepSeek V3.2 Chat"
    reasoning: false
    min_max_tokens: 8192
    fc_supported: true
    providers:
      OC_DS: "deepseek-ai/DeepSeek-V3.2"
      DS: "deepseek-chat"

  DS32R:
    name: "DeepSeek V3.2 Reasoner"
    reasoning: true
    min_max_tokens: 24000
    fc_supported: true
    providers:
      OC_DS: "deepseek/deepseek-r1-0528"
      DS: "deepseek-reasoner"

  SD20P:
    name: "Seed 2.0 Pro"
    reasoning: true
    min_max_tokens: 8192
    fc_supported: false
    providers:
      OC_ARK: "doubao-seed-2-0-pro-260215"
      ARK: "doubao-seed-2-0-pro-260215"

  SD20L:
    name: "Seed 2.0 Lite"
    reasoning: false
    min_max_tokens: 8192
    fc_supported: false
    providers:
      OC_ARK: "doubao-seed-2-0-lite-260215"
      ARK: "doubao-seed-2-0-lite-260215"

  SD16:
    name: "Seed 1.6"
    reasoning: false
    min_max_tokens: 8192
    fc_supported: false
    providers:
      OC_ARK: "doubao-seed-1-6-250615"
      ARK: "doubao-seed-1-6-250615"

  CLCH46:
    name: "Claude Code Haiku 4.6"
    reasoning: false
    min_max_tokens: 8192
    fc_supported: true
    providers:
      OC_CL_ANT: "claude-haiku-4-5-20251001"
      OC_CL: "claude-haiku-4-5-20251001"


# ── Provider 注册表 ───────────────────────────────────────────────────────────

providers:
  OC_CL:
    name: "OneChats Claude"
    type: openai_compatible
    api_key_env: ONE_CHATS_CLAUDE_API_KEY
    api_key_env_fallback: ONE_CHATS_API_KEY
    base_url: "https://chatapi.onechats.ai/v1"
    timeout: 300
    trust_env: false
    retry_strategy: timeout_escalation   # 300→600→900s

  OC_CL_ANT:
    name: "OneChats Claude (Anthropic Endpoint)"
    type: anthropic_compatible
    api_key_env: ONE_CHATS_CLAUDE_API_KEY
    api_key_env_fallback: ONE_CHATS_API_KEY
    base_url: "https://chatapi.onechats.ai"
    timeout: 300
    trust_env: false

  OC_GM:
    name: "OneChats Gemini"
    type: openai_compatible
    api_key_env: ONE_CHATS_GEMINI_API_KEY
    base_url: "https://chatapi.onechats.ai/v1"
    timeout: 300
    trust_env: false

  OC_ARK:
    name: "OneChats ARK"
    type: openai_compatible
    api_key_env: ONE_CHATS_ARK_API_KEY
    base_url: "https://chatapi.onechats.ai/v1"
    timeout: 120
    trust_env: false

  WS_LLM:
    name: "WaveSpeed Any-LLM"
    type: wavespeed_any_llm
    api_key_env: WAVESPEED_API_KEY
    base_url: "https://api.wavespeed.ai/api/v3"
    llm_base_url: "https://llm.wavespeed.ai/v1"
    timeout: 300
    trust_env: false

  OC_DS:
    name: "OneChats DeepSeek"
    type: openai_compatible
    api_key_env: ONE_CHATS_DEEPSEEK_API_KEY
    api_key_env_fallback: ONE_CHATS_API_KEY
    base_url: "https://chatapi.onechats.ai/v1"
    timeout: 120
    trust_env: false

  DS:
    name: "DeepSeek Official"
    type: openai_compatible
    api_key_env: DEEPSEEK_API_KEY
    base_url: "https://api.deepseek.com"
    timeout: 120
    trust_env: false

  GM_OFF:
    name: "Gemini Official"
    type: gemini_official
    api_key_env: GEMINI_API_KEY
    proxy_env: GEMINI_PROXY
    timeout: 120
    trust_env: false

  ARK:
    name: "Volcengine ARK"
    type: openai_compatible
    api_key_env: ARK_API_KEY
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    timeout: 120
    trust_env: false


# ── 角色注册表 ────────────────────────────────────────────────────────────────
#
# 调用方只传 llm_role="analyst"，由此表驱动 model/provider 选择。
#
# 字段说明：
#   active_model    — 默认使用的模型代号
#   temperature     — 默认温度（调用方显式传入时覆盖）
#   model_fallback  — 是否在 active_model 全部 provider 失败后切到下一个 model
#   system_prompt_prefix — 注入到 system message 前的角色前缀（可选）
#   models          — 此角色可用的模型列表，每个模型指定 provider 优先顺序
#
# DeerFlow 模型集成说明：
#   deerflow_config.yaml 定义了模型名: deerflow_default, deerflow_reasoning, deerflow_fast。
#   DeerFlow 内部组件（lead agent、summarization、title、memory）调用
#   create_chat_model(name=...) 时，hook 将 name 传给 ModelResolver.resolve()。
#
#   优先级链：
#     1. Skill phase 指定 tier → 使用该角色（含 provider failover）
#     2. name 在此文件 roles 中存在 → 使用该角色配置（provider/temperature）
#     3. name 不在此文件中 → 回退到 DeerFlow 原生 create_chat_model
#     4. name=None → 读取 deerflow_config.yaml 第一个模型名，再走上述链路
#
#   DeerFlow 角色（deerflow_*）与 Skill 质量角色（balanced/premium/fast）独立。
#   修改 deerflow_* 角色只影响 DeerFlow 组件，不影响 Skill phase 模型选择。

roles:

  # ── 质量角色（与原 ModelTier 一一对应）──

  gemini:
    temperature: 0.7
    model_fallback: false
    active_model: GM31P
    models:
      GM31P: { providers: [OC_GM, GM_OFF, WS_LLM] }

  premium:
    temperature: 0.7
    model_fallback: true
    active_model: CLO46T
    models:
      CLO46T: { providers: [OC_CL_ANT, OC_CL, WS_LLM] }
      CL46T: { providers: [OC_CL_ANT, OC_CL, WS_LLM] }

  balanced:
    temperature: 0.7
    model_fallback: false
    active_model: CL46T
    models:
      CL46T: { providers: [OC_CL_ANT, OC_CL, WS_LLM] }
      DS32R: { providers: [DS, OC_DS] }

  fast:
    temperature: 0.7
    model_fallback: false
    active_model: DS32C
    models:
      DS32C: { providers: [DS, OC_DS] }
      SD20L: { providers: [ARK, OC_ARK] }

  # ── DeerFlow 角色（独立于 Skill phase 的 balanced/premium/fast）──
  # 在 deerflow_config.yaml 中 name 字段引用这些角色名。
  # 删除某条 → 回退到 deerflow_config.yaml 自带的模型定义。

  deerflow_default:
    temperature: 0.7
    model_fallback: true
    active_model: CLO46T
    models:
      CLO46T: { providers: [OC_CL_ANT, OC_CL, WS_LLM] }
      CL46T: { providers: [OC_CL_ANT, OC_CL, WS_LLM] }
      DS32R: { providers: [DS, OC_DS] }

  deerflow_reasoning:
    temperature: 0.7
    model_fallback: true
    active_model: CLO46T
    models:
      CLO46T: { providers: [OC_CL_ANT, OC_CL, WS_LLM] }
      CL46T: { providers: [OC_CL_ANT, OC_CL, WS_LLM] }
      DS32R: { providers: [DS, OC_DS] }

  deerflow_fast:
    temperature: 0.7
    model_fallback: false
    active_model: CLCH46
    models:
      CLCH46: { providers: [OC_CL_ANT, OC_CL] }

  # ── 功能角色 ──
  analyst:
    temperature: 0.2
    model_fallback: false
    active_model: CL46T
    models:
      CL46T: { providers: [OC_CL_ANT, OC_CL, WS_LLM] }
      GM31P: { providers: [OC_GM] }

  architect:
    temperature: 0.2
    system_prompt_prefix: >-
      你是严谨的故事结构与逻辑一致性专家。
      优先保证因果链、状态链、世界观规则、伏笔闭环的正确性。
    model_fallback: false
    active_model: CL46T
    models:
      CL46T: { providers: [OC_CL_ANT, OC_CL, WS_LLM] }
      GM31P: { providers: [OC_GM] }

  drafter:
    temperature: 0.8
    system_prompt_prefix: >-
      你是爆款短视频解说的金牌编剧。
      优先输出有画面感、节奏强、情绪密度高的中文文案。
    model_fallback: false
    active_model: SD20P
    models:
      SD20P: { providers: [OC_ARK, ARK] }
      DS32R: { providers: [OC_DS, DS] }
      GM31P: { providers: [GM_OFF, WS_LLM] }

  vibe_critic:
    temperature: 0.4
    system_prompt_prefix: >-
      你是资深短剧制片人兼内容体验官。
      优先评估爽点释放、节奏推进、悬念合规和完播潜力。
    model_fallback: false
    active_model: SD20P
    models:
      SD20P: { providers: [OC_ARK, ARK] }
      DS32R: { providers: [OC_DS, DS] }
      GM31P: { providers: [GM_OFF, WS_LLM] }

  formatter:
    temperature: 0.1
    system_prompt_prefix: >-
      你是结构化格式化与字段映射专家。
      优先保证输出结构完整、字段准确、格式可解析。
    model_fallback: false
    active_model: SD16
    models:
      SD16:  { providers: [OC_ARK, ARK] }
      DS32C: { providers: [OC_DS, DS] }
      SD20L: { providers: [OC_ARK, ARK] }

  hook_writer:
    temperature: 0.5
    system_prompt_prefix: >-
      你是短视频爽剧开场Hook的专业写手。
      优先输出节奏紧凑、情绪密度高、结构严格按节拍顺序推进的中文文案。
    model_fallback: false
    active_model: SD16
    models:
      SD16:  { providers: [OC_ARK, ARK] }
      DS32C: { providers: [OC_DS, DS] }
      SD20L: { providers: [OC_ARK, ARK] }
