name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -e .[dev]
      # ruff strict scope MVP-0: 只 enforce 3 核心文件 (跟 mypy strict 对齐).
      # 全库 ruff check + format 全收敛 -> MVP-5 (见 docs/v1-reset/CHANGELOG_MVP0.md deferred items).
      - name: ruff check (核心文件)
        run: ruff check src/core/graph_agent/core/exceptions.py src/core/graph_agent/core/manifest.py src/core/graph_agent/core/checkpointer.py
      - name: ruff format check (核心文件)
        run: ruff format --check src/core/graph_agent/core/exceptions.py src/core/graph_agent/core/manifest.py src/core/graph_agent/core/checkpointer.py
      - name: mypy strict (核心文件)
        run: mypy --strict src/core/graph_agent/core/exceptions.py src/core/graph_agent/core/manifest.py src/core/graph_agent/core/checkpointer.py
      - name: pytest
        run: pytest tests/graph_agent/ --cov=src/core/graph_agent --cov-report=xml
      # MVP-0 baseline gate: 65 = 当前实测 (现 66%). 防退步.
      # MVP-5 收紧到核心 95% / 整体 85% (见 design.md §7).
      - name: coverage gate
        run: coverage report --fail-under=65
