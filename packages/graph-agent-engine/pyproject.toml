[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-agent-engine"
version = "0.2.0"
description = "Meta-package alias for graph-agent. Use graph-agent directly for new code; this name is preserved for legacy downstream projects (e.g. video-analysis) that pip-pin graph-agent-engine."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "agent-harness contributors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "graph-agent",
]

[tool.uv.sources]
graph-agent = { workspace = true }

# This is a meta-package: no Python source, just declares graph-agent as
# its only dependency. `pip install graph-agent-engine` is equivalent to
# `pip install graph-agent` for backward-compat with downstream pinning.

[tool.setuptools]
packages = []
