[package]
name = "skill-studio-tauri"
version = "0.1.0"
description = "Skill Studio desktop shell (Tauri 2.x)"
authors = ["SevenX <traveluxi.com@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/SevenX77/agent-harness"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
command-group = "5.0.1"
rand = "0.9.4"
sha2 = "0.10"
# Embedded CLI terminal (ah-orchestration-design.md §10): ConPTY on Windows,
# unix98 PTYs elsewhere, behind one API.
portable-pty = "0.9"
base64 = "0.22"

[dev-dependencies]
toml = "0.9"
