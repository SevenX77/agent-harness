# ah 编程 SOP · agent-harness 实例
# 源自 SevenX77/ah-scenario-pack dev-programming 场景(当前实战拓扑):
#   antigravity 主力实施/设计 + claude 协调/审计。
# 启动方式与本机(Windows/WSL)注意事项:.ah/README.md;验证命令档案:.ah/VERIFY.md。
version = "1"

# 主控/协调者:强语义 + 长上下文;场景规则 .ah/rules/master.md
# 注意:master 由本表决定(ah >= 1.4.0 官方模板形式),不要写成 [agents.master]
# ——那会额外孵化一个名叫 "master" 的普通 worker,真 master 反而落在默认配置上。
[master]
cmd = "claude"
enabled = true
# WSL 以 root 运行且需要 bypass 权限时改用(claude 对 root 强制要求 IS_SANDBOX=1):
# cmd = "IS_SANDBOX=1 claude --dangerously-skip-permissions"

# 完成信号:provider Stop hook 直推 ahd,是「内部后台任务型假完成」的编排器侧根治
[completion]
hook_push_enabled = true
hook_push_events = ["stop"]
hook_push_providers = ["claude", "codex", "antigravity"]

# 实现者:antigravity 主力编程(已知行为护栏,必读 .ah/rules/a1.md)
[agents.a1]
provider = "antigravity"

# 设计者:发散/第一性;必须与 master 异族,同族发散=回音壁(.ah/rules/a3.md)
[agents.a3]
provider = "antigravity"

# 审计者:唯一质量门,逐任务必审(.ah/rules/a4.md)
[agents.a4]
provider = "claude"

# 可选:第二实施通道(codex 配额恢复后启用;启用时补 .ah/rules/a2.md,
# 角色同 a1 但护栏按 codex 特性裁剪;缺规则文件时 ah 回退内置 worker 默认规则)
# [agents.a2]
# provider = "codex"

# ── CLI 层配置(模型 / effort / statusline / autoCompact)──────────────────────
# 源自 pack v0.4.0 实战拍板值。ah 把 [master.settings] / [agents.<id>.settings]
# 深合并进该角色沙箱的 .claude/settings.json(嵌套表=嵌套对象;同名键覆盖)。
# 硬限制(ah v1.4.0):仅 provider = "claude" 的角色支持——给 antigravity(a1/a3)
# 写 settings 会在配置加载时直接报错,它们的模型/effort 配在宿主全局
# ~/.gemini/antigravity-cli/settings.json 的 model 名里内嵌(本机实测值
# "Gemini 3.5 Flash (High)"——检查 effort 就看这个字段),随沙箱物化继承。
# 模型分档(pack 实战拍板):审计门用旗舰+最高持久化档(effortLevel 上限 xhigh,
# max 仅 session);master 用中档+medium(编排是短视野决策,质量门在审计与
# operator 物理验证,master 又是最烧 token 的常驻角色);实施走便宜模型——
# 这就是"便宜模型编排勾旗舰水准"的分档表达。
# 生效时机=沙箱物化(spawn)时;在跑的 agent 需 kill+up / 重启栈才带新配置。

[master.settings]
model = "claude-sonnet-5"
effortLevel = "medium"
autoCompactEnabled = true

# statusline 按 operator 监控需求配:角色(pane 对号)· 模型+effort(验证配置真生效)
# · context 占用%(compaction 临近=master 会吞消息的高危窗口,capture-pane 一眼可读)。
[master.settings.statusLine]
type = "command"
command = "jq -r '\"master · \\(.model.display_name) \\(.effort.level // \"?\") · ctx \\(.context_window.used_percentage // 0)%\"'"

[agents.a4.settings]
model = "claude-opus-4-8"
effortLevel = "xhigh"
autoCompactEnabled = true

[agents.a4.settings.statusLine]
type = "command"
command = "jq -r '\"a4-audit · \\(.model.display_name) \\(.effort.level // \"?\") · ctx \\(.context_window.used_percentage // 0)%\"'"
