function waveTodoStats(meta) {
  if (!meta) return { done: 0, total: 0 };
  if (Array.isArray(meta.nodes)) {
    return meta.nodes.reduce((acc, id) => {
      const node = findNodeById(id);
      if (!node) return acc;
      const items = [node, ...node.children];
      acc.total += items.length;
      acc.done += items.filter(item => item.status === 'ok').length;
      return acc;
    }, { done: 0, total: 0 });
  }
  if (Array.isArray(meta.tasks)) {
    return {
      done: meta.tasks.filter(task => task[1] === 'ok').length,
      total: meta.tasks.length
    };
  }
  return { done: 0, total: 0 };
}

      ? MODULE_DEEP_DIVES[d.id].sections.map(s => s.label.replace(' 标准','')).slice(0, 3).join(' / ')
      : spec ? spec.navSummary : '设计总览 · 修复路径 · ' + d.children.length + ' 个子节点 · ' + statusText(d.status);
    const repair = '<a class="progress-item" href="#' + d.id + '_logic" id="nav-' + d.id + '_logic"><span class="dot-indicator"></span><span class="item-label">' + d.code + ' 怎么修复</span><span class="status-dot ' + statusClass(d.status) + '"></span></a>';
    const children = d.children.map(c =>
      '<a class="progress-item" href="#' + c.id + '" id="nav-' + c.id + '"><span class="dot-indicator"></span><span class="item-label">' + c.code + ' ' + esc(c.title) + '</span><span class="status-dot ' + statusClass(c.status) + '"></span></a>'
    ).join('');
    return '<div class="toc-group"><a class="toc-parent" href="#' + d.id + '_overview" id="nav-' + d.id + '_overview"><span class="parent-node">' + d.code + '</span><span class="parent-title"><b>' + esc(displayTitle) + '</b><span>' + inlineCode(summary) + '</span></span><span class="status-dot ' + statusClass(d.status) + '"></span></a><div class="child-list">' + repair + children + '</div></div>';
  }).join('');
}
function buildDoc() {
  document.getElementById('docInner').innerHTML = renderS0(S0_PAGE) + D_TREE.map(d => renderParent(d) + renderRepairPage(d) + d.children.map(c => renderChild({ ...c, parent:d })).join('')).join('');
}
let current = 0;
function shortTitle(i) {
  const p = PAGES[i];
  if (!p) return '';
  if (p.kind === 's0') return 'S0 总章';
  if (p.kind === 'parent') return p.code + ' 总览';
  if (p.kind === 'repair') return p.code + ' 怎么修复';
  return p.code + ' ' + p.title;
}
function showPage(i, smooth) {
  current = Math.max(0, Math.min(PAGES.length - 1, i));
  const page = PAGES[current];
  const key = page.pageId;
  document.querySelectorAll('.doc-section').forEach(s => s.classList.toggle('active', s.id === key));
  PAGES.forEach((p, idx) => {
    const nav = document.getElementById('nav-' + p.pageId);
    if (!nav) return;
    nav.classList.toggle('active', idx === current);
    nav.classList.toggle('done', idx <= current);
  });
  const pct = Math.round(((current + 1) / PAGES.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('prev-btn').style.visibility = current === 0 ? 'hidden' : 'visible';
  document.getElementById('next-btn').style.visibility = current === PAGES.length - 1 ? 'hidden' : 'visible';
  document.getElementById('prev-label').textContent = current > 0 ? shortTitle(current - 1) : '';
  document.getElementById('next-label').textContent = current < PAGES.length - 1 ? shortTitle(current + 1) : '';
  window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
  if (history.replaceState) history.replaceState(null, '', '#' + key);
}
function nextPage() { if (current < PAGES.length - 1) showPage(current + 1, true); }
function prevPage() { if (current > 0) showPage(current - 1, true); }
window.addEventListener('load', () => {
  buildTOC();
  buildDoc();
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const id = a.getAttribute('href').slice(1);
      const idx = PAGES.findIndex(p => p.pageId === id);
      if (idx >= 0) showPage(idx, false);
    });
  });
  const hash = location.hash ? location.hash.slice(1) : 's0_overview';
  const start = PAGES.findIndex(p => p.pageId === hash);
  showPage(start >= 0 ? start : 0, false);
});
window.addEventListener('hashchange', () => {
  const hash = location.hash ? location.hash.slice(1) : 's0_overview';
  const idx = PAGES.findIndex(p => p.pageId === hash);
  if (idx >= 0 && idx !== current) showPage(idx, false);
});
</script>
</body>
