[project]
name = "graph-agent-harness"
version = "0.1.0"
description = "GraphAgent: SKILL.md-driven workflow harness layered on DeerFlow + LangGraph"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
]

# --- Version pins ----------------------------------------------------------
# Upper bounds are mandatory, not cosmetic:
#
# * langchain<1.2.11  — langchain 1.2.11+ requires langgraph>=1.1.5, which
#   conflicts with DeerFlow's own pyproject (langgraph<1.0.10). See
#   .kiro/specs/graph-agent-optimizations/deferred-items.md §I-4.
# * langgraph>=1.0.10  — bumped from <1.0.10 (DeerFlow 兼容约束) to fix
#   CVE-2026-28277. DeerFlow has been removed in v1-reset (47.6% rm)
#   so the old upper bound no longer applies. Upper bound <1.1.0 keeps
#   langchain<1.2.11 compatibility (langchain 1.2.11+ needs langgraph>=1.1.5).
# * langgraph-prebuilt<1.0.9  — 1.0.9+ imports ExecutionInfo / ServerInfo
#   from langgraph.runtime which do not exist in langgraph 1.0.x.
# ---------------------------------------------------------------------------
dependencies = [
    "langchain>=1.2.3,<1.2.11",
    "langchain-core>=1.3.1,<1.4.0",
    "langchain-anthropic>=1.3.4,<1.5.0",
    "langchain-deepseek>=1.0.1,<1.1.0",
    "langchain-openai>=1.1.7,<1.3.0",
    "langgraph>=1.0.10,<1.1.0",
    "langgraph-prebuilt>=1.0.6,<1.0.9",
    "langgraph-checkpoint>=4.0.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.0.3,<4.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "ruamel.yaml>=0.18.0,<0.19.0",
    "httpx>=0.28.0,<0.29.0",
    "anthropic>=0.96.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "markdownify>=1.2.2,<2.0.0",
    "readabilipy>=0.3.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "coverage>=7.0.0,<8.0.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.6",
    "pip-audit>=2.7.3,<3.0.0",
]
studio = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchdog>=4.0",
    "ptyprocess>=0.7",
]
google = ["langchain-google-genai>=2.0", "google-genai>=1.0"]
tts = ["edge-tts>=6.0"]
all = ["graph-agent-harness[google,tts]"]

[project.scripts]
graph-agent = "graph_agent.core.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Source currently lives at src/core/graph_agent/ (pending Task 7.6 physical
# move to packages/graph-agent/src/graph_agent/). The package maps to the
# legacy path via the `sources` remap below so `import graph_agent.*` keeps
# working regardless.
packages = ["src/core/graph_agent", "studio-backend/app"]

[tool.hatch.build.targets.wheel.sources]
"src/core/graph_agent" = "graph_agent"
"studio-backend/app" = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/core"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_any_generics = true
disallow_any_unimported = true
mypy_path = ["src/core", "studio-backend"]

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
    "ruamel.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.format]

[tool.ruff.lint.isort]
known-first-party = ["graph_agent"]

[tool.coverage.run]
source = ["src/core/graph_agent"]
omit = ["*/tests/*"]

[tool.coverage.report]
# Phase 3 RC baseline: current full-suite coverage is 73.25%. This gate prevents
# regression while Group 3 raises critical-path coverage for the final 1.0.0 cut.
fail_under = 73
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
