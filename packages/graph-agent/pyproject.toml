[project]
name = "graph-agent"
version = "0.3.1"
description = "Document-driven LLM agent harness SDK"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
    "graph-agent-gateway",
    "langchain>=1.3.9,<1.4.0",
    "langchain-core>=1.3.1,<1.5.0",
    "langchain-deepseek>=1.0.1,<1.1.0",
    "langgraph>=1.2.0,<1.3.0",
    "langgraph-prebuilt>=1.0.6,<1.2.0",
    "langgraph-checkpoint>=4.0.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.0.3,<4.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "ruamel.yaml>=0.18.0,<0.19.0",
    "jsonschema>=4,<5",
    "httpx>=0.28.0,<0.29.0",
    "anthropic>=0.96.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "markdownify>=1.2.2,<2.0.0",
    "readabilipy>=0.3.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "coverage>=7.0.0,<8.0.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.6",
    "pip-audit>=2.7.3,<3.0.0",
]
studio = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchdog>=4.0",
]
e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.5",
    "websockets>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "tier1: core smoke-tier tests for fast PR confidence",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["C901"]
"src/graph_agent/core/error_registry.py" = ["E501"]
"src/graph_agent/cognitive/prompt.py" = ["E501"]
"src/graph_agent/core/graph_assembler.py" = ["C901"]
"src/graph_agent/core/loader.py" = ["C901"]
"src/graph_agent/core/state.py" = ["C901", "E501"]
"src/graph_agent/runtime/state_mapper.py" = ["C901", "E501"]
"tests/**" = ["E501"]
"tests/test_round30_pr*_*.py" = ["I001"]

[[tool.mypy.overrides]]
module = "langgraph.checkpoint.postgres.*"
ignore_missing_imports = true
