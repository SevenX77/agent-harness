<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph-Agent · 运行机制与解决的问题</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-app: #f3f4f8;
    --bg-card: #f4f5f7;
    --border-color: #e4e6ea;
    --border-hover: #d0d4da;
    --text-title: #0e1116;
    --text-body: #3b414a;
    --text-muted: #8b919b;
    --accent-blue: #3266e8;
    --accent-blue-rgb: 50, 102, 232;
    --accent-blue-hover: #517def;
    --accent-teal: #00d2ff;
    --accent-green: #2ecc71;
    --accent-orange: #f39c12;
    --accent-red: #e74c3c;
    --accent-purple: #8e44ad;
    --font-sans: 'Outfit', 'Noto Sans SC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    /* Studio dark palette (mock) */
    --st-bg: #09090b;        /* zinc-950 */
    --st-panel: #131316;
    --st-border: #27272a;    /* zinc-800 */
    --st-border-soft:#1e1e22;
    --st-text: #e4e4e7;
    --st-muted: #8a8a93;
    --st-primary: #7c6cf0;   /* indigo-violet */
    --st-primary-soft: rgba(124,108,240,.16);
    --st-agent: #7c6cf0;
    --st-logic: #2dd4bf;
    --st-subgraph: #f59e0b;
    --st-io: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background-color: var(--bg-app); color: var(--text-body); font-family: var(--font-sans); line-height: 1.6; }

  .main-layout { display: flex; align-items: flex-start; gap: 24px; max-width: 1160px; margin: 0 auto; padding: 0 24px; }

  /* sidebar TOC */
  .sidebar { width: 264px; background: transparent; display: flex; flex-direction: column; padding: 30px 8px 30px 0; position: sticky; top: 0; align-self: flex-start; max-height: 100vh; overflow-y: auto; flex-shrink: 0; }
  .sidebar::-webkit-scrollbar { display: none; }
  .sb-card { background: #fff; border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 4px 18px rgba(20,30,60,.05); padding: 16px 14px; margin-bottom: 16px; }
  .sb-card.toc { padding: 14px 10px; }
  .toc-group { margin-bottom: 6px; }
  .toc-group:last-child { margin-bottom: 0; }
  .ccircle, .dot-indicator { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #d3d7df; position: relative; flex-shrink: 0; transition: all .25s; }
  .toc-chapter.done .ccircle, .progress-item.done .dot-indicator { background: var(--accent-green); border-color: var(--accent-green); }
  .toc-chapter.done .ccircle::after, .progress-item.done .dot-indicator::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .toc-chapter { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 700; color: var(--text-title); }
  .toc-chapter:hover { background: rgba(0,0,0,.03); }
  .progress-item { display: flex; align-items: center; gap: 11px; padding: 8px 10px 8px 14px; margin-left: 4px; border-radius: 9px; cursor: pointer; text-decoration: none; transition: background .2s; }
  .progress-item:hover { background: rgba(0,0,0,.03); }
  .progress-item.active { background: #eef0f3; }
  .item-label { font-size: 13px; font-weight: 500; color: #6b717b; transition: color .2s; line-height: 1.4; }
  .progress-item.active .item-label { color: var(--text-title); font-weight: 600; }
  .progress-item.done .item-label { color: var(--text-body); }
  .sb-progress-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; font-weight: 600; letter-spacing: .3px; }
  .sb-progress-row b { color: var(--text-title); font-weight: 700; }
  .sb-progress-track { height: 6px; background: #e9ebee; border-radius: 99px; overflow: hidden; }
  .sb-progress-fill { height: 100%; width: 0%; background: #1b1d21; border-radius: 99px; transition: width .4s ease; }

  /* reading column */
  .viewport { flex: 1; min-width: 0; }
  .reading-column { width: 100%; max-width: 820px; margin: 30px 0 56px; padding: 40px 48px 28px; background: #fff; border: 1px solid var(--border-color); border-radius: 18px; box-shadow: 0 12px 40px rgba(20,30,60,.06); overflow: hidden; min-width: 0; }
  .doc-section { display: none; }
  .doc-section.active { display: block; }
  .doc-section, .lesson-text { min-width: 0; overflow-wrap: break-word; word-break: break-word; }
  .doc-section img, .doc-section table, .doc-section .inline-canvas { max-width: 100%; }
  .card-header-tag { font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; font-weight: 700; color: var(--accent-blue-hover); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .card-header-tag::before { content: "■"; font-size: 8px; color: var(--accent-blue); }
  .lesson-title { font-size: 32px; font-weight: 800; color: var(--text-title); margin-bottom: 22px; line-height: 1.25; letter-spacing: -.6px; }
  .lesson-text { font-size: 15px; color: var(--text-body); line-height: 1.85; }
  .lesson-text p { margin-bottom: 16px; }
  .lesson-text b { color: var(--text-title); font-weight: 700; }
  .lesson-text ul { list-style: none; padding-left: 8px; margin-bottom: 14px; }
  .lesson-text li { position: relative; padding-left: 16px; margin-bottom: 8px; font-size: 14.5px; color: #555b65; }
  .lesson-text li::before { content: "▫"; position: absolute; left: 0; color: var(--accent-blue-hover); font-weight: bold; }
  .lesson-text code { font-family: var(--font-mono); font-size: 12px; background: #eef1f6; border: 1px solid var(--border-color); border-radius: 4px; padding: 1px 5px; color: #0d7a92; }
  .lesson-alert { background: rgba(50,102,232,.07); border-left: 3px solid var(--accent-blue); padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 16px; font-size: 13px; color: #2a4aa0; line-height: 1.65; }
  .lesson-alert b { color: #1a347e; }
  .lesson-alert.alert-green { background: rgba(46,204,113,.09); border-left-color: var(--accent-green); color: #1f7a45; }
  .lesson-alert.alert-green b { color: #15602f; }
  .lesson-alert.alert-amber { background: rgba(243,156,18,.10); border-left-color: var(--accent-orange); color: #8a5a08; }
  .lesson-alert.alert-amber b { color: #6b4406; }
  .big-quote { font-size: 20px; line-height: 1.62; font-weight: 600; color: var(--text-title); border-left: 3px solid var(--accent-blue); padding: 4px 0 4px 22px; margin: 10px 0 24px; letter-spacing: -.2px; }
  .big-quote .src { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-top: 12px; letter-spacing: 0; }
  .sec-label { font-size: 17px; font-weight: 800; color: var(--text-title); margin: 26px 0 12px; letter-spacing: -.3px; display: flex; align-items: center; gap: 9px; }
  .sec-label::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--accent-blue); }

  /* principle cards / comparison / flywheel reused */
  .pcards { display: grid; gap: 12px; margin: 8px 0 22px; }
  .pcards.cols-3 { grid-template-columns: repeat(3,1fr); }
  @media(max-width:760px){ .pcards.cols-3 { grid-template-columns: 1fr; } }
  .pcard { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px 16px; transition: border-color .25s; }
  .pcard:hover { border-color: var(--border-hover); }
  .pcard .pc-ico { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent-blue-hover); margin-bottom: 8px; letter-spacing: .5px; }
  .pcard .pc-h { font-size: 15px; font-weight: 700; color: var(--text-title); margin-bottom: 6px; }
  .pcard .pc-t { font-size: 13px; color: var(--text-muted); line-height: 1.65; }
  .cmp { width: 100%; border-collapse: separate; border-spacing: 0; margin: 10px 0 22px; font-size: 13.5px; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
  .cmp th, .cmp td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border-color); }
  .cmp thead th { background: #f4f5f7; font-size: 12px; color: var(--text-muted); font-weight: 700; letter-spacing: .4px; }
  .cmp thead th.us { color: #1763c4; }
  .cmp tbody td:first-child { color: #5a606a; font-weight: 700; width: 34%; }
  .cmp td.them { color: #6c727c; }
  .cmp td.us { color: #16357a; background: rgba(50,102,232,.07); font-weight: 600; }
  .cmp tr:last-child td { border-bottom: none; }
  .flywheel { display: flex; flex-direction: column; gap: 0; margin: 12px 0 22px; }
  .fw-stage { position: relative; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px 18px; }
  .fw-stage.top { border-color: rgba(50,102,232,.4); box-shadow: 0 0 24px rgba(50,102,232,.08) inset; }
  .fw-stage.bottom { border-color: rgba(46,204,113,.35); }
  .fw-stage .fw-k { font-family: var(--font-mono); font-size: 11px; color: var(--accent-blue-hover); font-weight: 700; margin-bottom: 5px; letter-spacing: .5px; }
  .fw-stage.bottom .fw-k { color: var(--accent-green); }
  .fw-stage .fw-h { font-size: 15.5px; font-weight: 700; color: var(--text-title); margin-bottom: 5px; }
  .fw-stage .fw-t { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
  .fw-arrow { text-align: center; color: var(--text-muted); font-size: 12px; padding: 8px 0; letter-spacing: .5px; }
  .fw-arrow b { color: var(--accent-teal); font-weight: 600; }

  /* paginator */
  .paginator { display: flex; align-items: stretch; justify-content: space-between; gap: 14px; margin-top: 40px; flex-shrink: 0; }
  .nav-btn { flex: 1; min-width: 0; background-color: #14161b; border: 1px solid #14161b; color: #d6dae1; padding: 16px 18px; border-radius: 12px; cursor: pointer; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: all .2s; }
  #prev-btn { justify-content: flex-start; }
  #next-btn { justify-content: flex-end; }
  .nav-btn:hover { background-color: #20232b; }
  .nb-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #prev-label { text-align: left; flex: 1; }
  #next-label { text-align: right; flex: 1; }

  /* ===== STUDIO MOCK (dark canvas embedded in light page) ===== */
  .studio { margin: 16px 0 26px; border: 1px solid var(--st-border); border-radius: 12px; overflow: hidden; background: var(--st-bg); box-shadow: 0 16px 44px rgba(20,30,60,.16); font-size: 13px; }
  .studio-title { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #0d0d10; border-bottom: 1px solid var(--st-border); }
  .studio-title .dots { display: flex; gap: 6px; }
  .studio-title .dots i { width: 10px; height: 10px; border-radius: 50%; background: #2c2c31; display: block; }
  .studio-title .tt { font-family: var(--font-mono); font-size: 11px; color: var(--st-muted); letter-spacing: .4px; }
  .studio-title .tt b { color: var(--st-text); font-weight: 600; }
  .studio-body { display: flex; min-height: 360px; }
  .studio-rail { width: 46px; background: #0d0d10; border-right: 1px solid var(--st-border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; flex-shrink: 0; }
  .rail-ico { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--st-muted); font-size: 14px; cursor: pointer; transition: all .2s; }
  .rail-ico:hover { background: #1a1a1f; color: var(--st-text); }
  .rail-ico.active { background: var(--st-primary-soft); color: #b6acff; }
  .studio-main { flex: 1; min-width: 0; display: flex; }
  .studio-canvas { flex: 1; min-width: 0; position: relative; background-color: var(--st-bg); background-image: radial-gradient(var(--st-border) 1px, transparent 1px); background-size: 18px 18px; }
  .studio-canvas svg { width: 100%; height: 100%; display: block; }
  .studio-panel { width: 230px; border-left: 1px solid var(--st-border); background: var(--st-panel); flex-shrink: 0; display: flex; flex-direction: column; }
  .panel-head { height: 34px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--st-border); font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--st-muted); text-transform: uppercase; font-family: var(--font-mono); }
  .panel-body { padding: 12px; overflow-y: auto; }
  .pf-row { margin-bottom: 11px; }
  .pf-k { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--st-muted); margin-bottom: 3px; font-family: var(--font-mono); }
  .pf-v { font-size: 12.5px; color: var(--st-text); }
  .pf-v .chip { display: inline-block; background: #1c1c22; border: 1px solid var(--st-border); border-radius: 5px; padding: 1px 7px; margin: 2px 3px 0 0; font-size: 11px; font-family: var(--font-mono); color: #c9c4ff; }
  .pf-empty { color: var(--st-muted); font-size: 12px; font-style: italic; }
  /* mock monaco code */
  .mono { background: #0d0d10; border-right: 1px solid var(--st-border); width: 44%; flex-shrink: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.7; color: #cfd2da; overflow: auto; white-space: pre; }
  .mono .k { color: #c586c0; } .mono .s { color: #9cdcfe; } .mono .c { color: #6a9955; } .mono .n { color: #b5cea8; } .mono .t { color: #4ec9b0; }
  /* control bar */
  .studio-ctrl { display: flex; gap: 8px; padding: 12px 14px 4px; flex-wrap: wrap; align-items: center; }
  .sbtn { font-size: 12px; font-weight: 600; padding: 6px 13px; border-radius: 7px; background: #16161b; border: 1px solid var(--st-border); color: var(--st-text); cursor: pointer; transition: all .18s; }
  .sbtn:hover { border-color: #3a3a42; }
  .sbtn.active { background: var(--st-primary-soft); border-color: var(--st-primary); color: #c3bbff; }
  .sbtn.green.active { background: rgba(45,212,191,.15); border-color: var(--st-logic); color: #5eead4; }
  .ctrl-hint { font-size: 11px; color: var(--st-muted); }
  /* trace timeline mock */
  .trace { border-top: 1px solid var(--st-border); background: #0d0d10; max-height: 118px; overflow-y: auto; padding: 8px 12px; font-family: var(--font-mono); font-size: 11px; }
  .trace-row { display: flex; gap: 8px; padding: 2px 0; color: var(--st-muted); opacity: .35; transition: opacity .25s; }
  .trace-row.on { opacity: 1; color: var(--st-text); }
  .trace-row .ev { color: #b6acff; }
  .trace-row .ok { color: var(--st-logic); }
  /* SVG node helpers */
  .nlabel { fill: var(--st-text); font-size: 11px; font-weight: 600; font-family: var(--font-sans); }
  .nsub { fill: var(--st-muted); font-size: 9px; font-family: var(--font-mono); }
  .nkind { font-size: 8.5px; font-family: var(--font-mono); font-weight: 700; letter-spacing: .5px; }
  .gedge { stroke: #3a3a42; stroke-width: 1.6; fill: none; transition: stroke .3s, stroke-width .3s; }
  .gedge.flow { stroke: var(--st-primary); stroke-width: 2.2; stroke-dasharray: 4 4; animation: gdash 1s linear infinite; }
  @keyframes gdash { to { stroke-dashoffset: -16; } }
  .gnode { transition: all .25s; cursor: pointer; }
  .gnode rect { transition: all .3s; }
  .gnode.dim rect { opacity: .5; }
  .gnode.running rect { filter: drop-shadow(0 0 7px var(--st-primary)); }
  .gnode.done rect { stroke-width: 2; }
  .gbadge { font-size: 8.5px; font-family: var(--font-mono); font-weight: 700; }
  .gbadge.run { fill: #b6acff; }
  .gbadge.ok { fill: var(--st-logic); }
  .gbadge.idle { fill: var(--st-muted); }
  .gbadge.stale { fill: var(--accent-orange); }
  @keyframes stpulse { from { opacity: .55; } to { opacity: 1; } }
  .gnode.running .gbadge { animation: stpulse .9s infinite alternate; }
  .gnode.stale rect { stroke: var(--accent-orange) !important; fill: rgba(245,158,11,.08) !important; }

  @media(max-width:760px){ .sidebar { display: none; } .mono { display:none; } }

  /* ===== DEMO ⑦ agent-loop (scoped, axioms→protocols + gated loop) ===== */
  #demo-loop { --gold:#e9b949; --ok:#2dd4bf; --bad:#f87171; --warn:#f59e0b; }
  #demo-loop .lp-stage { display: flex; }
  #demo-loop .studio-canvas svg { height: 520px; }
  #demo-loop .lp-side { width: 280px; border-left: 1px solid var(--st-border); background: var(--st-panel); padding: 14px; flex-shrink: 0; overflow-y: auto; max-height: 520px; }
  #demo-loop .lp-side h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--st-muted); font-family: var(--font-mono); margin: 0 0 9px; display: flex; align-items: center; gap: 6px; }
  #demo-loop .lp-side h4 .imp { color: var(--gold); font-size: 9px; opacity: 0; transition: opacity .3s; }
  #demo-loop .lp-side h4 .imp.on { opacity: 1; }
  #demo-loop .ax-item { border: 1px solid var(--st-border); border-radius: 7px; padding: 7px 9px; margin-bottom: 7px; background: #16161b; opacity: .4; transition: all .35s; }
  #demo-loop .ax-item.lit { opacity: 1; border-color: var(--gold); box-shadow: 0 0 0 1px rgba(233,185,73,.25); }
  #demo-loop .ax-item .axt { font-size: 12px; font-weight: 700; color: #d4d4d8; }
  #demo-loop .ax-item .axt b { color: var(--gold); font-family: var(--font-mono); font-size: 11px; margin-right: 5px; }
  #demo-loop .ax-item .axd { font-size: 11px; color: var(--st-muted); margin-top: 1px; }
  #demo-loop .derive { text-align: center; color: var(--st-muted); font-size: 16px; margin: 4px 0 8px; }
  #demo-loop .pr-item { border: 1px solid var(--st-border); border-radius: 7px; padding: 7px 9px; margin-bottom: 7px; background: #141019; opacity: .4; transition: all .35s; }
  #demo-loop .pr-item.lit { opacity: 1; border-color: var(--st-primary); box-shadow: 0 0 0 1px var(--st-primary-soft); }
  #demo-loop .pr-item .prt { font-size: 12px; font-weight: 700; color: #c3bbff; }
  #demo-loop .pr-item .prt b { font-family: var(--font-mono); font-size: 11px; color: #b6acff; margin-right: 5px; }
  #demo-loop .pr-item .proj { font-size: 10px; color: var(--gold); font-family: var(--font-mono); margin: 2px 0; }
  #demo-loop .pr-item .prr { font-size: 11px; color: var(--st-muted); }
  #demo-loop .gnode.dim { opacity: .22; }
  #demo-loop .plusdot { cursor: pointer; }
  #demo-loop .plusdot circle { fill: #16161b; stroke: var(--st-primary); stroke-width: 1.6; transition: all .2s; }
  #demo-loop .plusdot:hover circle { fill: var(--st-primary-soft); }
  #demo-loop .plusdot text { fill: var(--st-primary); font-size: 15px; font-weight: 700; font-family: var(--font-mono); }
  #demo-loop .snode rect { transition: all .3s; }
  #demo-loop .snode.run rect { stroke: var(--st-primary); stroke-width: 2.4; filter: drop-shadow(0 0 7px var(--st-primary)); }
  #demo-loop .snode.ok rect { stroke: var(--ok); stroke-width: 2.2; }
  #demo-loop .snode.bad rect { stroke: var(--bad); stroke-width: 2.2; }
  #demo-loop .snode.kbhit rect { stroke: var(--gold); stroke-width: 2.2; filter: drop-shadow(0 0 8px var(--gold)); }
  #demo-loop .kbtag { fill: var(--gold); font-size: 9px; font-weight: 700; font-family: var(--font-mono); opacity: 0; transition: opacity .25s; }
  #demo-loop .kbtag.on { opacity: 1; }
  #demo-loop .sconn { stroke: var(--st-primary); stroke-width: 1.6; fill: none; stroke-dasharray: 4 3; opacity: .55; }
  #demo-loop .backedge { stroke: var(--warn); stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; opacity: .3; }
  #demo-loop .backedge.flow { opacity: 1; animation: lpdash .8s linear; }
  #demo-loop .backlabel { fill: var(--warn); font-size: 8.5px; font-weight: 700; font-family: var(--font-mono); opacity: .5; }
  #demo-loop .backlabel.flow { opacity: 1; }
  @keyframes lpdash { from { stroke-dashoffset: 54; } to { stroke-dashoffset: 0; } }
  #demo-loop .lp-trace { max-height: none; height: 220px; }
  #demo-loop .lp-trace .trow { display: flex; gap: 8px; padding: 2px 0; opacity: 0; transform: translateX(-3px); transition: opacity .25s, transform .25s; align-items: baseline; }
  #demo-loop .lp-trace .trow.on { opacity: 1; transform: none; }
  #demo-loop .lp-trace .ti { color: #52525b; flex-shrink: 0; width: 26px; text-align: right; }
  #demo-loop .lp-trace .tg { flex-shrink: 0; width: 70px; font-weight: 700; }
  #demo-loop .lp-trace .tx { color: #c9c9d1; }
  #demo-loop .lp-trace .tg.kb { color: var(--gold); }
  #demo-loop .lp-trace .tg.plan { color: #b6acff; }
  #demo-loop .lp-trace .tg.act { color: #c3bbff; }

  <script>
    // ===== TOC structure =====
    const TOC = [
      { ch: '序 · 起点', items: [['intro','0.1 专业流程缺什么'],['handoff','0.2 领域知识到产品代码的磨损'],['thesis','0.3 两条价值主线']] },
      { ch: '1. Workflow as Source Code', items: [['source','1.1 流程源码'],['authoring','1.2 作者与机器的共同语言'],['compilerMental','1.3 不是配置,是可编译对象']] },
      { ch: '2. Compiler + Runtime', items: [['compile','2.1 compile / assemble'],['predict','2.2 predict 预演'],['run','2.3 run 与 trace']] },
      { ch: '3. Local Edit == Cloud Run', items: [['localLoop','3.1 本地短循环'],['cloudSameGraph','3.2 云端同图运行'],['aiWorkflowDev','3.3 AI 自动开发 workflow 的底座']] },
      { ch: '4. Bounded Autonomy', items: [['bounded','4.1 确定图包住局部智能'],['nodes','4.2 三类节点'],['subgraph','4.3 子图与迭代']] },
      { ch: '5. Knowledge as Control', items: [['knowledge','5.1 知识先接入'],['gates','5.2 知识变门禁'],['quality','5.3 从硬标准到审美标准']] },
      { ch: '6. Lineage 与系统位置', items: [['lineage','6.1 依赖链与局部重算'],['observability','6.2 可观测性是信任基础'],['position','6.3 引擎 / 网关 / 工作台']] },
    ];
    const slideKeys = TOC.flatMap(g => g.items.map(i => i[0]));

    // ===== SLIDE CONTENT (filled below via SLIDES) =====
    const SLIDES = {};
    // placeholder; real content injected by CONTENT script block

    // ===== engine =====
    let current = 0;
    function buildTOC() {
      const toc = document.getElementById('toc');
      toc.innerHTML = TOC.map(g => {
        const items = g.items.map(([k,label]) =>
          `<a class="progress-item" href="#${k}" id="nav-${k}"><span class="dot-indicator"></span><span class="item-label">${label}</span></a>`
        ).join('');
        return `<div class="toc-group"><div class="toc-chapter"><span class="ccircle"></span><span>${g.ch}</span></div>${items}</div>`;
      }).join('');
    }
    function buildDoc() {
      const docInner = document.getElementById('docInner');
      slideKeys.forEach(key => {
        const data = SLIDES[key];
        if (!data) return;
        const section = document.createElement('section');
        section.className = 'doc-section';
        section.id = key;
        section.innerHTML =
          '<div class="card-header-tag">' + data.tag + '</div>' +
          '<h2 class="lesson-title">' + data.title + '</h2>' +
          '<div class="lesson-text">' + data.text + '</div>';
        docInner.appendChild(section);
      });
    }
    function shortTitle(key) { return (SLIDES[key] && SLIDES[key].title) ? SLIDES[key].title : key; }
    function updateChapterDots() {
      document.querySelectorAll('.toc-group').forEach(group => {
        const items = group.querySelectorAll('.progress-item');
        let allDone = items.length > 0;
        items.forEach(it => { if (!it.classList.contains('done')) allDone = false; });
        group.querySelector('.toc-chapter')?.classList.toggle('done', allDone);
      });
    }
    function mountDemo(key) {
      const sec = document.getElementById(key);
      if (!sec) return;
      const slot = sec.querySelector('[data-demo]');
      if (!slot || slot.dataset.mounted) return;
      const demoId = slot.getAttribute('data-demo');
      const demo = document.getElementById(demoId);
      if (demo) { slot.appendChild(demo); slot.dataset.mounted = '1'; demo.style.display = ''; if (typeof DEMO_INIT[demoId] === 'function') DEMO_INIT[demoId](); }
    }
    function showPage(i, smooth) {
      current = Math.max(0, Math.min(slideKeys.length - 1, i));
      const key = slideKeys[current];
      document.querySelectorAll('.doc-section').forEach(s => s.classList.toggle('active', s.id === key));
      slideKeys.forEach((k, idx) => {
        const nav = document.getElementById('nav-' + k);
        if (!nav) return;
        nav.classList.toggle('active', idx === current);
        nav.classList.toggle('done', idx <= current);
      });
      updateChapterDots();
      mountDemo(key);
      const pct = Math.round(((current + 1) / slideKeys.length) * 100);
      const f = document.getElementById('progress-fill'); if (f) f.style.width = pct + '%';
      const p = document.getElementById('progress-pct'); if (p) p.textContent = pct + '%';
      const prevBtn = document.getElementById('prev-btn'), nextBtn = document.getElementById('next-btn');
      const prevLbl = document.getElementById('prev-label'), nextLbl = document.getElementById('next-label');
      if (prevBtn) prevBtn.style.visibility = current === 0 ? 'hidden' : 'visible';
      if (nextBtn) nextBtn.style.visibility = current === slideKeys.length - 1 ? 'hidden' : 'visible';
      if (prevLbl) prevLbl.textContent = current > 0 ? shortTitle(slideKeys[current - 1]) : '';
      if (nextLbl) nextLbl.textContent = current < slideKeys.length - 1 ? shortTitle(slideKeys[current + 1]) : '';
      window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
      if (history.replaceState) history.replaceState(null, '', '#' + key);
    }
    function nextPage() { if (current < slideKeys.length - 1) showPage(current + 1, true); }
    function prevPage() { if (current > 0) showPage(current - 1, true); }
    const DEMO_INIT = {};

    window.addEventListener('load', () => {
      buildTOC();
      buildDoc();
      document.querySelectorAll('.progress-item').forEach(a => {
        a.addEventListener('click', e => { e.preventDefault(); const key = a.getAttribute('href').slice(1); const idx = slideKeys.indexOf(key); if (idx >= 0) showPage(idx, false); });
      });
      document.querySelectorAll('.toc-chapter').forEach(h => {
        h.addEventListener('click', () => { const first = h.parentElement.querySelector('.progress-item'); if (first) { const idx = slideKeys.indexOf(first.getAttribute('href').slice(1)); if (idx >= 0) showPage(idx, false); } });
      });
      const start = location.hash ? slideKeys.indexOf(location.hash.slice(1)) : 0;
      showPage(start >= 0 ? start : 0, false);
    });
    window.addEventListener('hashchange', () => {
      const idx = location.hash ? slideKeys.indexOf(location.hash.slice(1)) : 0;
      if (idx >= 0 && idx !== current) showPage(idx, false);
    });
  </script>

  <script>
  // ===== shared graph renderer for all studio mocks =====
  const SVGNS = 'http://www.w3.org/2000/svg';
  const KIND_COLOR = { agent:'#7c6cf0', logic:'#2dd4bf', subgraph:'#f59e0b', io:'#64748b' };
  const KIND_LABEL = { agent:'AGENT', logic:'LOGIC', subgraph:'SUBGRAPH', io:'I/O' };
  function NS(t){ return document.createElementNS(SVGNS, t); }
  function gget(svg, id){ return svg.querySelector('.gnode[data-id="'+id+'"]'); }

  function renderGraph(svg, nodes, edges, dir){
    dir = dir || 'h';
    svg.innerHTML = '';
    const map = {}; nodes.forEach(n => map[n.id] = n);
    edges.forEach(([a,b]) => {
      const s = map[a], t = map[b]; if(!s||!t) return;
      let x1,y1,x2,y2,c1x,c1y,c2x,c2y;
      if(dir==='h'){ x1=s.x+s.w; y1=s.y+s.h/2; x2=t.x; y2=t.y+t.h/2; const dx=Math.max(24,(x2-x1)/2); c1x=x1+dx; c1y=y1; c2x=x2-dx; c2y=y2; }
      else { x1=s.x+s.w/2; y1=s.y+s.h; x2=t.x+t.w/2; y2=t.y; const dy=Math.max(18,(y2-y1)/2); c1x=x1; c1y=y1+dy; c2x=x2; c2y=y2-dy; }
      const p = NS('path');
      p.setAttribute('class','gedge');
      p.setAttribute('data-edge', a+'>'+b);
      p.setAttribute('d', 'M '+x1+' '+y1+' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+x2+' '+y2);
      svg.appendChild(p);
    });
    nodes.forEach(n => {
      const g = NS('g');
      g.setAttribute('class','gnode'+(n.kind==='io'?' dim':''));
      g.setAttribute('data-id', n.id);
      const r = NS('rect');
      r.setAttribute('x',n.x); r.setAttribute('y',n.y); r.setAttribute('width',n.w); r.setAttribute('height',n.h); r.setAttribute('rx',8);
      r.setAttribute('fill','#16161b'); r.setAttribute('stroke',KIND_COLOR[n.kind]); r.setAttribute('stroke-width',1.6);
      g.appendChild(r);
      const k = NS('text'); k.setAttribute('class','nkind'); k.setAttribute('x',n.x+9); k.setAttribute('y',n.y+15); k.setAttribute('fill',KIND_COLOR[n.kind]); k.textContent = KIND_LABEL[n.kind]; g.appendChild(k);
      const l = NS('text'); l.setAttribute('class','nlabel'); l.setAttribute('x',n.x+n.w/2); l.setAttribute('y',n.y+n.h-11); l.setAttribute('text-anchor','middle'); l.textContent = n.label; g.appendChild(l);
      const b = NS('text'); b.setAttribute('class','gbadge idle'); b.setAttribute('data-badge',''); b.setAttribute('x',n.x+n.w-9); b.setAttribute('y',n.y+15); b.setAttribute('text-anchor','end'); b.textContent='○'; g.appendChild(b);
      svg.appendChild(g);
    });
  }
  function setState(svg, id, state){
    const g = gget(svg, id); if(!g) return;
    g.classList.remove('running','done','stale');
    const b = g.querySelector('[data-badge]');
    if(state==='running'){ g.classList.add('running'); b.setAttribute('class','gbadge run'); b.textContent='● run'; }
    else if(state==='done'){ g.classList.add('done'); b.setAttribute('class','gbadge ok'); b.textContent='✓'; }
    else if(state==='stale'){ g.classList.add('stale'); b.setAttribute('class','gbadge stale'); b.textContent='▲ stale'; }
    else { b.setAttribute('class','gbadge idle'); b.textContent='○'; }
  }
  function setFlow(svg, a, b, on){ const e = svg.querySelector('[data-edge="'+a+'>'+b+'"]'); if(e) e.classList.toggle('flow', !!on); }
  function $(id){ return document.getElementById(id); }

  // ===== topologies (coordinates baked for clarity) =====
  function linearH(){ return {
    nodes:[
      {id:'input',label:'input',kind:'io',x:8,y:77,w:100,h:46},
      {id:'segment',label:'segment',kind:'agent',x:122,y:77,w:104,h:46},
      {id:'score',label:'score',kind:'logic',x:240,y:77,w:104,h:46},
      {id:'expand',label:'expand',kind:'subgraph',x:358,y:77,w:104,h:46},
      {id:'output',label:'output',kind:'io',x:476,y:77,w:78,h:46},
    ],
    edges:[['input','segment'],['segment','score'],['score','expand'],['expand','output']] };
  }
  function fanH(){ return {
    nodes:[
      {id:'input',label:'input',kind:'io',x:8,y:77,w:92,h:46},
      {id:'prepare',label:'prepare',kind:'agent',x:120,y:77,w:104,h:46},
      {id:'branch_a',label:'branch_a',kind:'agent',x:244,y:30,w:104,h:46},
      {id:'branch_b',label:'branch_b',kind:'agent',x:244,y:124,w:104,h:46},
      {id:'assemble',label:'assemble',kind:'logic',x:368,y:77,w:104,h:46},
      {id:'output',label:'output',kind:'io',x:486,y:77,w:66,h:46},
    ],
    edges:[['input','prepare'],['prepare','branch_a'],['prepare','branch_b'],['branch_a','assemble'],['branch_b','assemble'],['assemble','output']] };
  }
  function linearV(){ return {
    nodes:[
      {id:'input',label:'input',kind:'io',x:45,y:6,w:150,h:44},
      {id:'segment',label:'segment',kind:'agent',x:45,y:70,w:150,h:44},

        if(n.exp){
          const cxp=MX+MW+13, cyp=mY(i)+MH/2;
          const pd=NS('g'); pd.setAttribute('class','plusdot'); pd.setAttribute('data-exp',n.id);
          const c=NS('circle'); c.setAttribute('cx',cxp);c.setAttribute('cy',cyp);c.setAttribute('r',9); pd.appendChild(c);
          const tx=NS('text'); tx.setAttribute('x',cxp);tx.setAttribute('y',cyp+5);tx.setAttribute('text-anchor','middle');
          tx.textContent=(expanded===n.id)?'\u2212':'+'; pd.appendChild(tx);
          pd.addEventListener('click',()=>toggleExpand(n.id));
          svg.appendChild(pd);
        }
      });
      if(expanded) renderLoop(expanded);
    }

    function renderLoop(id){
      const svg=$('lp-svg');
      const idx=MAIN.findIndex(n=>n.id===id);
      const g=NS('g'); g.setAttribute('id','lp-loopg');
      const cxL=LX+LW/2;
      const px=MX+MW+13, py=mY(idx)+MH/2;
      const conn=NS('path'); conn.setAttribute('class','sconn');
      conn.setAttribute('d','M '+(px+9)+' '+py+' C '+(px+60)+' '+py+' '+(LX-50)+' '+(sY(0)+SH/2)+' '+LX+' '+(sY(0)+SH/2));
      g.appendChild(conn);
      for(let i=0;i<STEPS.length-1;i++){
        const p=NS('path'); p.setAttribute('class','gedge');
        const y1=sY(i)+SH, y2=sY(i+1);
        p.setAttribute('d','M '+cxL+' '+y1+' C '+cxL+' '+(y1+12)+' '+cxL+' '+(y2-12)+' '+cxL+' '+y2);
        g.appendChild(p);
      }
      const rY=sY(3)+SH/2, aY=sY(2)+SH/2;
      const be=NS('path'); be.setAttribute('id','lp-backedge'); be.setAttribute('class','backedge');
      be.setAttribute('d','M '+LX+' '+rY+' C '+(LX-36)+' '+(rY-4)+' '+(LX-36)+' '+(aY+4)+' '+LX+' '+aY);
      g.appendChild(be);
      const bl=NS('text'); bl.setAttribute('class','backlabel');bl.setAttribute('x',LX-34);bl.setAttribute('y',(rY+aY)/2);bl.setAttribute('text-anchor','middle');
      bl.textContent='BLOCK ↺'; g.appendChild(bl);
      STEPS.forEach((s,i)=>{
        const sn=NS('g'); sn.setAttribute('class','snode'); sn.setAttribute('data-id',s.id);
        const r=NS('rect'); r.setAttribute('x',LX);r.setAttribute('y',sY(i));r.setAttribute('width',LW);r.setAttribute('height',SH);r.setAttribute('rx',8);
        r.setAttribute('fill','#15151b');r.setAttribute('stroke','#45454f');r.setAttribute('stroke-width',1.6); sn.appendChild(r);
        const t=NS('text'); t.setAttribute('class','nlabel');t.setAttribute('x',LX+11);t.setAttribute('y',sY(i)+20);t.textContent=(i+1)+'. '+s.t; sn.appendChild(t);
        const sub=NS('text'); sub.setAttribute('class','nsub');sub.setAttribute('x',LX+11);sub.setAttribute('y',sY(i)+35);sub.textContent=s.sub; sn.appendChild(sub);
        g.appendChild(sn);
        if(s.kb){
          const kt=NS('text'); kt.setAttribute('class','kbtag'); kt.setAttribute('id','lp-kbtag-'+s.id);
          kt.setAttribute('x',LX+LW-8);kt.setAttribute('y',sY(i)-5);kt.setAttribute('text-anchor','end');
          kt.textContent='\u25C6 KB 推导注入'; g.appendChild(kt);
        }
      });
      svg.appendChild(g);
    }

    function setSnode(id,state){ const n=document.querySelector('#lp-loopg .snode[data-id="'+id+'"]'); if(!n)return; n.classList.remove('run','ok','bad','kbhit'); if(state)n.classList.add(state); }
    function showKBTag(id,on){ const t=$('lp-kbtag-'+id); if(t)t.classList.toggle('on',!!on); }
    async function flowBack(){ const e=$('lp-backedge'),l=document.querySelector('#lp-loopg .backlabel'); if(e)e.classList.add('flow'); if(l)l.classList.add('flow'); setSnode('act','run'); await sleep(820); if(e)e.classList.remove('flow'); if(l)l.classList.remove('flow'); }

    function renderSidebar(phase){
      let h='<h4>知识库 · 公理层 <span class="imp" id="lp-imp-ax">载入中</span></h4>';
      AXIOMS.forEach(a=>{ h+='<div class="ax-item" id="lp-ax-'+a.id+'"><div class="axt"><b>'+a.rn+'</b>'+a.t+'</div><div class="axd">'+a.d+'</div></div>'; });
      h+='<div class="derive">\u21D3 运行时推导 \u21D3</div>';
      h+='<h4>协议层 · 本 phase 适用 <span class="imp" id="lp-imp-pr">推导中</span></h4>';
      (PHASE_KB[phase]||[]).forEach(p=>{ h+='<div class="pr-item" id="lp-pr-'+p.p+'"><div class="prt"><b>'+(p.p==='SC'?'schema':p.p)+'</b>'+p.name+'</div><div class="proj">\u2190 '+p.proj+'</div><div class="prr">'+p.rule+'</div></div>'; });
      $('lp-kb').innerHTML=h;
    }
    function litAxiom(id){ const e=$('lp-ax-'+id); if(e)e.classList.add('lit'); const i=$('lp-imp-ax'); if(i)i.classList.add('on'); }
    function litProto(p){ const e=$('lp-pr-'+p); if(e)e.classList.add('lit'); const i=$('lp-imp-pr'); if(i)i.classList.add('on'); }
    function resetKB(){ document.querySelectorAll('#lp-kb .ax-item,#lp-kb .pr-item').forEach(e=>e.classList.remove('lit')); document.querySelectorAll('#lp-kb .imp').forEach(e=>e.classList.remove('on')); }

    const TAGNAME={kb:'KB',plan:'PLAN',act:'ACT',review:'REVIEW',gate:'GATE',out:'OUT'};
    function emit(tag,html){
      traceIdx++;
      const tr=$('lp-trace'); const d=document.createElement('div'); d.className='trow';
      d.innerHTML='<span class="ti">'+traceIdx+'</span><span class="tg '+tag+'">'+(TAGNAME[tag]||tag)+'</span><span class="tx">'+html+'</span>';
      tr.appendChild(d); tr.scrollTop=tr.scrollHeight; requestAnimationFrame(()=>d.classList.add('on'));
    }

    function toggleExpand(id){
      if(running) return;
      expanded=(expanded===id)?null:id;
      renderMain();
      if(expanded){ renderSidebar(expanded); $('lp-hint').textContent='已展开 '+expanded+' · 点 ▶ 运行'; }
      else { $('lp-kb').innerHTML=''; $('lp-hint').textContent='先点节点右侧 + 展开,再运行'; }
      $('lp-trace').innerHTML=''; traceIdx=0;
    }

    function toggleSingle(){
      if(running) return; single=!single;
      $('lp-single').classList.toggle('active',single);
      $('lp-hint').textContent = single ? '单次 LLM 模式:运行看缺陷如何漏过' : 'Agent Loop 模式:运行看完整闭环';
      $('lp-trace').innerHTML=''; traceIdx=0;
    }

    async function RUN(){
      if(running) return;
      if(!expanded){ toggleExpand('entity_spatial'); await sleep(120); }
      running=true; const tok=++runToken;
      $('lp-run').disabled=true; $('lp-run').textContent='● 运行中…';
      $('lp-trace').innerHTML=''; traceIdx=0; resetKB();
      STEPS.forEach(s=>{ setSnode(s.id,null); showKBTag(s.id,false); });
      const seq=SEQ[expanded][single?'single':'loop'];
      for(const it of seq){
        if(tok!==runToken) return;
        if(it.think){ if(it.node) setSnode(it.node,'run'); await sleep(it.think); }
        if(tok!==runToken) return;
        if(it.node && it.state) setSnode(it.node,it.state);
        if(it.axiom) litAxiom(it.axiom);
        if(it.proto) litProto(it.proto);
        if(it.kbtag) showKBTag(it.kbtag,true);
        if(it.back){ await flowBack(); if(tok!==runToken) return; }
        emit(it.tag,it.tx);
        await sleep(it.gap||780);
      }
      running=false;
      $('lp-run').disabled=false; $('lp-run').textContent='▶ 运行 Agent Loop';
      $('lp-hint').textContent = single
        ? '单次 LLM:带缺陷直接输出 ✗(共 3 项未被发现)'
        : 'Agent Loop:跑了 3 轮(2 次打回)后全部达标 ✓';
    }

    DEMO_INIT['demo-loop'] = function(){ single=false; running=false; expanded=null; $('lp-single').classList.remove('active'); renderMain(); toggleExpand('entity_spatial'); };
    window.LOOP_RUN = RUN;
    window.LOOP_toggleSingle = toggleSingle;
  })();
  </script>
</body>
</html>
