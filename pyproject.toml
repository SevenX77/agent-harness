[project]
name = "agent-harness-workspace"
version = "0.1.0"
description = "Monorepo for GraphAgent SDK and Studio"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
workspace = { members = ["packages/*", "apps/studio/backend"] }

[tool.uv.sources]
graph-agent = { workspace = true }
studio-backend = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.6",
    "libcst>=1.8.6",
    "import-linter>=2.11",
    "studio-backend",
]
e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
    "websockets>=12",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "packages/graph-agent/tests",
    "apps/studio/backend/tests",
    "apps/studio/tests-e2e",
]
pythonpath = [
    "packages/graph-agent/src",
    "apps/studio/backend",
]
addopts = ["--import-mode=importlib"]
consider_namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "B", "I", "UP"]

# Targeted exemptions for legitimate patterns that the default rule set
# misclassifies. Both groups are intentional, not technical debt.
[tool.ruff.lint.per-file-ignores]
# Test files (incl. tests-e2e/) routinely embed long URL/JSON/SQL fixtures
# and parametrise with payloads that simply do not fit in 100 columns;
# rewrapping hurts readability without improving safety.
"**/tests/**" = ["E501"]
"apps/studio/tests-e2e/**" = ["E501"]
# Cognitive prompt files contain Chinese natural-language directives
# embedded as Python string literals; line-length is irrelevant to
# how the LLM consumes them, and forcing line breaks risks distorting
# the wording.
"packages/graph-agent/src/graph_agent/cognitive/**" = ["E501"]
# FastAPI's `Depends(...)`, `Query(...)`, `Body(...)`, etc. are designed
# to be evaluated at request time, not at import time. The framework
# expects them as default values — B008 is a false positive throughout
# the FastAPI app, not just in routers/.
"apps/studio/backend/app/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["langgraph.checkpoint.postgres", "langgraph.checkpoint.postgres.*", "ptyprocess.*"]
ignore_missing_imports = true
