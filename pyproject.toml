[project]
name = "agent-harness-workspace"
version = "0.1.0"
description = "Monorepo for GraphAgent SDK and Studio"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
workspace = { members = ["packages/*", "apps/studio/backend"] }

[tool.uv.sources]
graph-agent = { workspace = true }
graph-agent-gateway = { workspace = true }
studio-backend = { workspace = true }

[dependency-groups]
dev = [
    "qrcode>=8.2",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.6",
    "libcst>=1.8.6",
    "import-linter>=2.11",
    "studio-backend",
]
e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
    "websockets>=12",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "packages/graph-agent/tests",
    "apps/studio/backend/tests",
    "apps/studio/tests-e2e",
]
pythonpath = [
    "packages/graph-agent/src",
    "packages/graph-agent-gateway/src",
    "apps/studio/backend",
]
addopts = ["--import-mode=importlib"]
consider_namespace_packages = true

[tool.ruff]
line-length = 120  # 从 100 升, 兼容 Chinese docstring/message 自然长度
target-version = "py311"
# PLW1514: text I/O must pass encoding= explicitly — Windows otherwise decodes
# with the locale codepage (GBK on zh-CN). See docs/development/CROSS_PLATFORM.md.
# PLW1514 is still a preview rule; explicit-preview-rules limits preview mode
# to exactly the codes listed here so stable-rule behavior is unchanged.
lint.select = ["E", "F", "B", "I", "UP", "PLW1514"]
lint.preview = true
lint.explicit-preview-rules = true

# Targeted exemptions for legitimate patterns that the default rule set
# misclassifies. Both groups are intentional, not technical debt.
[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["C901"]
"packages/graph-agent/src/graph_agent/core/error_registry.py" = ["E501"]
"packages/graph-agent/src/graph_agent/cognitive/prompt.py" = ["E501"]
"packages/graph-agent/tests/**" = ["E501"]
# Test files (incl. tests-e2e/) routinely embed long URL/JSON/SQL fixtures
# and parametrise with payloads that simply do not fit in 100 columns;
# rewrapping hurts readability without improving safety.
"**/tests/**" = ["E501"]
"apps/studio/tests-e2e/**" = ["E501"]
# Cognitive prompt files contain Chinese natural-language directives
# embedded as Python string literals; line-length is irrelevant to
# how the LLM consumes them, and forcing line breaks risks distorting
# the wording.
"packages/graph-agent/src/graph_agent/cognitive/**" = ["E501"]
# FastAPI's `Depends(...)`, `Query(...)`, `Body(...)`, etc. are designed
# to be evaluated at request time, not at import time. The framework
# expects them as default values — B008 is a false positive throughout
# the FastAPI app, not just in routers/.
"apps/studio/backend/app/**" = ["B008"]

[tool.coverage.run]
relative_files = true
parallel = true
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = [
    "packages/graph-agent/src",
    "packages/graph-agent-gateway/src",
    "apps/studio/backend",
]
exclude = [
    "packages/graph-agent/tests",
    "apps/studio/backend/tests",
    "apps/studio/tests-e2e",
    "skills",
    "skills/story-deconstruction",
    "scripts",
]

[[tool.mypy.overrides]]
module = ["langgraph.checkpoint.postgres", "langgraph.checkpoint.postgres.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "langchain_anthropic", "yaml", "yaml.*"]
ignore_missing_imports = true

# V1 cutover legacy quarantine; pending deeper V1->V2 migration spec.
[[tool.mypy.overrides]]
module = [
    "graph_agent.core.skill_builder",
    "graph_agent.core.personas",
    "graph_agent.core.validators.persona_resolution",
    "graph_agent.core.validators.prompt_quality",
    "graph_agent.core.validators.template_variables",
    "graph_agent.core.validators.tool_paths",
    "graph_agent.core.validators.validator_required",
    "scripts.run_e2e_test",
    "scripts.run_e2e_test_enhanced",
]
ignore_errors = true
