[project]
name = "studio-backend"
version = "3.0.0"
description = "Skill Studio backend (FastAPI sidecar)"
requires-python = ">=3.11"
dependencies = [
    "graph-agent",
    # [google] is required, not optional, for this app: the gateway keeps
    # langchain-google-genai behind that extra, and the desktop app's vendored
    # dependency closure comes from `uv export --package studio-backend`. Without
    # it every google_genai route in the packaged app dies on the ImportError
    # `call/factory.py` raises, while a dev tree synced with `--all-extras` shows
    # nothing wrong. Gate: test_the_backend_declares_every_gateway_extra_its_routes_need.
    "graph-agent-gateway[google]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.0.0",
    "aiofiles>=23.0.0",
    "sqlalchemy>=2.0.0",
    "watchdog>=4.0.0",
    "watchfiles>=1.1.1",
    "python-multipart>=0.0.5",
    "starlette>=0.37.2",
    "claude-agent-sdk>=0.1.80",
    "mcp>=1.29",
    "cryptography>=50",
]

[tool.uv.sources]
graph-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

