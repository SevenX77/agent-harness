name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -e .[dev]
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format check
        run: ruff format --check src/ tests/
      - name: mypy strict (核心文件)
        run: mypy --strict src/core/graph_agent/core/exceptions.py src/core/graph_agent/core/manifest.py src/core/graph_agent/core/checkpointer.py
      - name: pytest
        run: pytest tests/graph_agent/ --cov=src/core/graph_agent --cov-report=xml
      - name: coverage gate
        run: coverage report --fail-under=85
