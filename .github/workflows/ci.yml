name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace dependencies
        run: uv sync --all-packages --all-extras --group dev

      - name: ruff check
        run: |
          uv run ruff check \
            packages/graph-agent/src \
            packages/graph-agent/tests \
            packages/graph-agent-gateway/src \
            packages/graph-agent-gateway/tests \
            apps/studio/backend/app \
            apps/studio/backend/tests \
            apps/studio/tests-e2e

      - name: mypy graph-agent strict
        run: |
          uv run mypy --strict packages/graph-agent/src

      - name: mypy graph-agent-gateway strict
        run: |
          uv run mypy --strict packages/graph-agent-gateway/src

      - name: mypy studio backend
        run: |
          uv run mypy apps/studio/backend/app

      - name: pytest studio backend
        run: |
          uv run pytest apps/studio/backend/tests \
            --tb=short -q \
            --cov=apps/studio/backend/app \
            --cov-report=xml:coverage-backend.xml \
            --cov-report=term

      - name: pytest graph-agent-gateway
        run: |
          uv run pytest packages/graph-agent-gateway/tests \
            --tb=short -q

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-backend.xml
          flags: backend
          fail_ci_if_error: false

      - name: dependency audit
        run: uv run --with pip-audit pip-audit

  graph-agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            py_flag: "py311"
          - python-version: "3.12"
            py_flag: "py312"
          - python-version: "3.13"
            py_flag: "py313"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace dependencies
        run: uv sync --all-packages --all-extras --group dev

      - name: pytest graph-agent (unit + integration)
        timeout-minutes: 15
        run: |
          uv run pytest packages/graph-agent/tests \
            --tb=short -vv \
            -o faulthandler_timeout=120 \
            --cov=packages/graph-agent/src/graph_agent \
            --cov-report=xml:coverage-graph-agent.xml \
            --cov-report=term

      - name: Upload graph-agent coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-graph-agent.xml
          flags: graph-agent,${{ matrix.py_flag }}
          fail_ci_if_error: false

      - name: validate round28 contract manifests
        run: |
          uv run python packages/graph-agent/scripts/validate_round28_manifest.py \
            packages/graph-agent/spec/features.yaml \
            packages/graph-agent/spec/source_file_map.yaml \
            packages/graph-agent/spec/contract_map.yaml

  frontend-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/studio/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/studio/frontend
        run: npm ci

      - name: frontend lint
        run: npm --prefix apps/studio/frontend run lint

      - name: frontend typecheck
        run: npm --prefix apps/studio/frontend run typecheck

      - name: frontend unit tests
        run: npm --prefix apps/studio/frontend test

      - name: frontend build
        run: npm --prefix apps/studio/frontend run build

  e2e-tests:
    # E2E suite needs the frontend dev server (Vite) plus Playwright Chromium,
    # which requires a dedicated runner setup. Disabled on PR/push for now;
    # trigger manually via the Actions tab while CI runner setup is finalized.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace dependencies (with e2e)
        run: uv sync --all-packages --all-extras --group dev --group e2e

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/studio/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/studio/frontend
        run: npm ci

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: pytest studio e2e
        run: |
          uv run pytest apps/studio/tests-e2e \
            --tb=short -q

  cross-platform-smoke:
    # Windows/macOS observation signal (docs/development/CROSS_PLATFORM.md,
    # layer 5). NOT a required check — a red run here never blocks a merge;
    # it exists so platform-specific breakage is visible instead of unknown.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      # Self-contained UTF-8 bottom line (also set workflow-wide) so this job
      # behaves the same even when run from a branch predating that env.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace dependencies
        run: uv sync --all-packages --all-extras --group dev

      - name: pytest studio backend
        run: uv run pytest apps/studio/backend/tests --tb=short -q

      - name: pytest graph-agent-gateway
        run: uv run pytest packages/graph-agent-gateway/tests --tb=short -q

      - name: pytest graph-agent
        run: uv run pytest packages/graph-agent/tests --tb=short -q -o faulthandler_timeout=120

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/studio/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/studio/frontend
        run: npm ci

      - name: frontend build
        run: npm --prefix apps/studio/frontend run build
