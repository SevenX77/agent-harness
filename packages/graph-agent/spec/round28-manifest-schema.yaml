$schema: https://json-schema.org/draft/2020-12/schema
title: Round28ManifestSchema
type: object

$defs:
  feature_id:
    type: string
    pattern: "^F-[a-z0-9-]+$"

  nodeid:
    type: string
    minLength: 1
    pattern: "^tests/.+::.+$"

  path_entry:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path:
        type: string
        minLength: 1
      anchor:
        type: string
        minLength: 1

  feature:
    type: object
    additionalProperties: false
    required:
      - id
      - description
      - feature_boundary
      - sources
      - core_paths
      - error_codes_primary
      - error_codes_secondary
      - events_primary
      - events_secondary
      - non_functional_contracts
      - targeted_tests
    properties:
      id:
        type: string
        pattern: "^F-[a-z0-9-]+$"
      description:
        type: string
        minLength: 1
      feature_boundary:
        type: object
        additionalProperties: false
        required: [kind, evidence]
        properties:
          kind:
            enum: [public-method, lifecycle-behavior, externally-observable-behavior]
          evidence:
            type: string
            minLength: 1
      sources:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      public_api_symbols:
        type: array
        items:
          type: string
          minLength: 1
      skill_spec_sections:
        type: array
        items:
          type: string
          pattern: "^docs/engine/skill-spec/(00-FORMAT-GROUND-TRUTH|01-physical-layout|02-graph-md-spec|03-logic-md-spec|04-subgraph-md-spec|05-agent-md-spec|06-cognitive-template-spec|07-mention-syntax-spec|08-resource-mechanisms-spec|09-builtin-modules-spec|10-skill-resolver-protocol-spec|11-error-code-spec|12-compile-runtime-flow-spec|README)\\.md#.+$"
      consumer_files:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              enum: [stable-export, vendor-only-debt, live-consumer]
            path:
              type: string
              minLength: 1
            symbol:
              type: string
              minLength: 1
      core_paths:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [path]
          properties:
            path:
              type: string
              minLength: 1
            anchor:
              type: string
              minLength: 1
      error_codes_primary:
        type: array
        items:
          type: string
          pattern: "^\\[F-v3-[a-z0-9-]+\\]$"
      error_codes_secondary:
        type: array
        items:
          type: string
          pattern: "^\\[F-v3-[a-z0-9-]+\\]$"
      events_primary:
        type: array
        items:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*Event$"
      events_secondary:
        type: array
        items:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*Event$"
      non_functional_contracts:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, type, description, evidence]
          properties:
            id:
              type: string
              minLength: 1
            type:
              enum:
                - token-quota
                - concurrency
                - timeout
                - state-isolation
                - sandbox
                - ordering
                - compatibility
                - observability
                - determinism
                - security
                - performance
                - other
            description:
              type: string
              minLength: 1
            evidence:
              type: string
              minLength: 1
      targeted_tests:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
          pattern: "^tests/.+::.+$"

  features_manifest:
    type: object
    additionalProperties: false
    required: [features]
    properties:
      features:
        type: array
        minItems: 1
        items:
          type: object

  source_file_map:
    type: object
    additionalProperties: false
    required: [files]
    properties:
      files:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [path, classification]
          properties:
            path:
              type: string
              minLength: 1
            classification:
              enum: [feature, detail, debt]
            feature_ids:
              type: array
              items:
                type: string
                pattern: "^F-[a-z0-9-]+$"
            feature_id:
              type: string
              pattern: "^F-[a-z0-9-]+$"
            exemption_id:
              type: string
              pattern: "^EX-[0-9]{4}-[a-z0-9-]+$"
          allOf:
            - if:
                properties:
                  classification:
                    const: debt
                required: [classification]
              then:
                required: [exemption_id]
            - if:
                properties:
                  classification:
                    const: feature
                required: [classification]
              then:
                required: [feature_ids]

  contract_map:
    type: object
    additionalProperties: false
    required: [public_api_symbols, skill_spec_sections, consumer_files]
    properties:
      public_api_symbols:
        type: object
        minProperties: 1
        required:
          - AgentSkillDef
          - GraphSkillDef
          - IoInput
          - PersonaSkillDef
          - CompileIssue
          - parse_skill_file
        patternProperties:
          "^[A-Za-z_][A-Za-z0-9_]*$":
            type: object
            additionalProperties: false
            required: [feature_ids]
            properties:
              feature_ids:
                type: array
                minItems: 1
                items:
                  type: string
                  pattern: "^F-[a-z0-9-]+$"
        additionalProperties: false
      skill_spec_sections:
        type: object
        patternProperties:
          "^docs/engine/skill-spec/.+\\.md#.+$":
            type: object
            additionalProperties: false
            required: [feature_ids]
            properties:
              feature_ids:
                type: array
                minItems: 1
                items:
                  type: string
                  pattern: "^F-[a-z0-9-]+$"
        additionalProperties: false
      consumer_files:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [kind, feature_ids]
          properties:
            kind:
              enum: [stable-export, vendor-only-debt, live-consumer]
            path:
              type: string
              minLength: 1
            symbol:
              type: string
              minLength: 1
            feature_ids:
              type: array
              minItems: 1
              items:
                type: string
                pattern: "^F-[a-z0-9-]+$"

  contract_exemptions:
    type: object
    additionalProperties: false
    required: [version, exemptions]
    properties:
      version:
        type: string
      exemptions:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - exemption_id
            - pr
            - pm_approval
            - reason
            - affected_features
            - replacement_feature_ids
            - expires_or_cleanup
          properties:
            exemption_id:
              type: string
              pattern: "^EX-[0-9]{4}-[a-z0-9-]+$"
            pr:
              type: string
              minLength: 1
            pm_approval:
              type: string
              minLength: 1
            reason:
              type: string
              minLength: 1
            symbols:
              type: array
              items:
                type: string
            fields:
              type: array
              items:
                type: string
            hashes:
              type: array
              items:
                type: string
            affected_features:
              type: array
              minItems: 1
              items:
                type: string
                pattern: "^F-[a-z0-9-]+$"
            replacement_feature_ids:
              type: array
              minItems: 1
              items:
                type: string
                pattern: "^F-[a-z0-9-]+$"
            expires_or_cleanup:
              type: string
              minLength: 1
