[project]
name = "agent-harness-workspace"
version = "0.1.0"
description = "Monorepo for GraphAgent SDK and Studio"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
workspace = { members = ["packages/*", "apps/studio/backend"] }

[tool.uv.sources]
graph-agent = { workspace = true }
studio-backend = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.6",
    "libcst>=1.8.6",
    "import-linter>=2.11",
    "studio-backend",
]
e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
    "websockets>=12",
]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["langgraph.checkpoint.postgres", "langgraph.checkpoint.postgres.*", "ptyprocess.*"]
ignore_missing_imports = true
